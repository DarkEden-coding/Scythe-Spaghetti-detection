[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scythe-spaghetti-detection"
version = "0.3.0"
description = "Self-hosted 3D printer spaghetti detection for Moonraker printers."
readme = "readme.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "DarkEden-coding", email = "darkedenc9@gmail.com" }]
keywords = ["3d-printing", "klipper", "moonraker", "yolo", "spaghetti-detection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: End Users/Desktop",
    "Programming Language :: Python :: 3",
    "Topic :: Printing",
]

# Runtime only; keep in step with requirements.txt. Training tooling lives in
# the `train` extra so a printer install stays small.
dependencies = [
    "aiohttp>=3.9,<4",
    "discord.py>=2.3,<3",
    "requests>=2.31,<3",
    "urllib3>=1.26,<3",
    "Pillow>=10.0,<14",
    "numpy>=1.24",
    "onnxruntime>=1.16,<2; platform_machine != 'armv7l' and platform_machine != 'armv6l'",
]

[project.optional-dependencies]
# Dataset collection, training, and ONNX export.
train = [
    "ultralytics>=8.1,<9",
    "onnx>=1.15,<2",
    "onnxsim>=0.4,<1",
    "roboflow>=1.1,<2",
]
dev = [
    "pytest>=7.4,<10",
    "pytest-asyncio>=0.23,<2",
    "ruff>=0.4,<1",
]

[project.scripts]
scythe = "src.cli:main"

[project.urls]
Homepage = "https://github.com/DarkEden-coding/Scythe-Spaghetti-detection"
Issues = "https://github.com/DarkEden-coding/Scythe-Spaghetti-detection/issues"

[tool.setuptools.packages.find]
include = ["src*", "tools*"]

[tool.setuptools.package-data]
"src.web" = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:src.*"]

[tool.ruff]
line-length = 90
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "E501",   # line length is handled by the formatter
    "B008",   # argparse/dataclass defaults
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"]
