name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          # The checkpoint is not needed to lint or run the test suite.
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        # The runtime no longer needs Torch, so the suite runs against the
        # real dependency set.
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest pytest-asyncio ruff

      - name: Check shell scripts
        run: shellcheck -S warning install.sh deploy/scythe-helper

      - name: Lint
        run: ruff check src tools tests

      - name: Test
        run: pytest -q
