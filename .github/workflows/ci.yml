name: CI

on:
  push:
    branches: [master, main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
        with:
          # The 84 MB checkpoint is not needed to lint or run the test suite.
          lfs: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install test dependencies
        # Deliberately not the full runtime set: ultralytics pulls Torch, and
        # the suite is built so that nothing under test needs it.
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-asyncio ruff requests Pillow urllib3

      - name: Lint
        run: ruff check src tools tests

      - name: Test
        run: pytest -q
