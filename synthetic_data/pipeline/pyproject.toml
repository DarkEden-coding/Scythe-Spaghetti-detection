[project]
name = "synthpipe"
version = "0.1.0"
description = "Synthetic print-failure sequence pipeline: corpus, slicing, G-code timelines, job runner, ISP, real-data prep."
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=2.0",
    "pillow>=11",
    "opencv-python-headless>=4.10",
    "thingi10k>=1.5.0",
    "trimesh>=5.1.1",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
synthpipe = "synthpipe.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["synthpipe"]

[tool.ruff]
line-length = 100
